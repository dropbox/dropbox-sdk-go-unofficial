name: Test
on:
  pull_request:
  push:
    branches: [ master ]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
    - name: Checkout code
      uses: actions/checkout@v7
    - name: Install Go
      uses: actions/setup-go@v7
      with:
        go-version-file: v6/go.mod
        cache-dependency-path: v6/go.sum
    - name: Vet
      run: go vet ./...
      working-directory: ./v6
    - name: Test
      run: go test -vet=off -race -v ./...
      working-directory: ./v6
